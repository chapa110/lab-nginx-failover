name: Lab Nginx failover

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  failover:
    runs-on: ubuntu-latest
    steps:
      - name: Levantar laboratorio (3 contenedores en lab_nginx_net)
        run: |
          docker network create --subnet 192.168.56.0/24 lab_nginx_net
          for n in 2 3; do
            mkdir -p /tmp/m$n
            echo "<h1>Respuesta desde maquina$n (192.168.56.1$n)</h1>" > /tmp/m$n/index.html
            docker run -d --name maquina$n --network lab_nginx_net --ip 192.168.56.1$n \
              -v /tmp/m$n:/usr/share/nginx/html:ro nginx:alpine
          done
          cat > /tmp/lb.conf <<'EOF'
          upstream backend {
              server 192.168.56.12 max_fails=1 fail_timeout=10s;
              server 192.168.56.13 max_fails=1 fail_timeout=10s;
          }
          server {
              listen 80;
              location / {
                  proxy_pass http://backend;
                  proxy_connect_timeout 1s;
                  proxy_next_upstream error timeout http_502 http_503;
              }
          }
          EOF
          docker run -d --name maquina1 --network lab_nginx_net --ip 192.168.56.11 \
            -v /tmp/lb.conf:/etc/nginx/conf.d/default.conf:ro nginx:alpine
          sleep 3
          docker exec maquina1 apk add --no-cache curl > /dev/null
          docker ps --format 'table {{.Names}}\t{{.Status}}'

      - name: Prueba 1 - round-robin con ambos backends
        run: |
          echo '$ for i in 1 2 3 4 5 6; do docker exec maquina1 curl -s http://localhost; done'
          for i in 1 2 3 4 5 6; do docker exec maquina1 curl -s http://localhost; done

      - name: Prueba 2 - failover (maquina3 caida)
        run: |
          echo '$ docker stop maquina3'
          docker stop maquina3
          echo '$ for i in 1 2 3 4 5 6; do docker exec maquina1 curl -s http://localhost; done'
          for i in 1 2 3 4 5 6; do docker exec maquina1 curl -s http://localhost; done
          echo '$ docker start maquina3'
          docker start maquina3
