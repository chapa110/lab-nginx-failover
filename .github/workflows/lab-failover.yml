name: Prueba de failover

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  failover:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar entorno
        run: |
          docker network create --subnet 192.168.56.0/24 lab_nginx_net > /dev/null
          for n in 2 3; do
            mkdir -p /tmp/m$n
            echo "<h1>Respondió: maquina$n (192.168.56.1$n)</h1>" > /tmp/m$n/index.html
            docker run -d --name maquina$n --network lab_nginx_net --ip 192.168.56.1$n \
              -v /tmp/m$n:/usr/share/nginx/html:ro nginx:alpine > /dev/null
          done
          cat > /tmp/lb.conf <<'EOF'
          upstream backend {
              server 192.168.56.12 max_fails=1 fail_timeout=10s;
              server 192.168.56.13 max_fails=1 fail_timeout=10s;
          }
          server {
              listen 80;
              location / {
                  proxy_pass http://backend;
                  proxy_connect_timeout 1s;
                  proxy_next_upstream error timeout http_502 http_503;
              }
          }
          EOF
          docker run -d --name maquina1 --network lab_nginx_net --ip 192.168.56.11 \
            -v /tmp/lb.conf:/etc/nginx/conf.d/default.conf:ro nginx:alpine > /dev/null
          sleep 3
          docker exec maquina1 apk add --no-cache curl bash > /dev/null

      - name: Prueba 1 - Balanceo
        run: |
          CMD='for i in $(seq 1 6); do curl -s http://localhost/ | grep -o "Respondió: maquina[2-3]"; done'
          echo "\$ docker exec maquina1 bash -c '$CMD'"
          docker exec maquina1 bash -c "$CMD"

      - name: Prueba 2 - Failover
        run: |
          echo "Prueba de tolerancia a fallos: se detiene maquina3 (192.168.56.13) y se envían"
          echo "6 peticiones desde maquina1 para verificar que Nginx reorienta el tráfico sin interrupciones."
          echo
          echo '$ docker stop maquina3'
          docker stop maquina3
          CMD='for i in $(seq 1 6); do curl -s http://localhost/ | grep -o "Respondió: maquina[2-3]"; done'
          echo "\$ docker exec maquina1 bash -c '$CMD'"
          docker exec maquina1 bash -c "$CMD"
          echo '$ docker start maquina3'
          docker start maquina3
